openapi: 3.0.3
info:
  title: TRONow Merchant OpenAPI
  version: 1.2.0
  description: |
    Stable merchant contract for current prices, energy orders, paid address activation, order tracking and balances.
    GET /prices/quote is a read-only current-price preview. POST /orders obtains the merchant's current price again, locks that amount for the order, and never changes the merchant charge during provider failover. A successful POST response is the authoritative order price.
    Merchant-wide rolling 1-second limits default to 50 authenticated requests and 10 order/activation POSTs per second, shared across API keys and service instances. Platform administrators configure both limits. Retries and idempotent replays consume quota. HTTP 429 RATE_LIMITED includes Retry-After seconds and X-RateLimit-Scope (requests/orders); this attempt has not entered business processing. Regenerate nonce, timestamp and signature for every attempt; preserve business identifiers and idempotency keys. X-RateLimit-Limit/Remaining and X-OrderRateLimit-Limit/Remaining provide current snapshots. HTTP 503 RATE_LIMIT_UNAVAILABLE fails closed before business processing.
externalDocs:
  description: Error reference with HTTP statuses, recovery rules and asynchronous failure codes (five languages available).
  url: https://tronow.io/developers/errors.en.md
x-error-catalog-url: https://tronow.io/developers/error-codes.json
servers:
  - url: https://api.tronow.io/openapi/v1
security:
  - MerchantHMAC: []
paths:
  /prices/quote:
    get:
      operationId: getCurrentPrice
      summary: 查询商户当前销售价格
      parameters:
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
        - name: resource_type
          in: query
          required: true
          description: 'Resource to deliver; currently ENERGY only. / 交付资源类型；当前仅开放 ENERGY。'
          schema:
            $ref: '#/components/schemas/ResourceType'
        - name: resource_amount
          in: query
          required: true
          description: 'Exact Energy amount enabled for this merchant. / 商户已开通产品范围内的准确能量数量。'
          schema:
            type: integer
            format: int64
            minimum: 1
            example: 65000
        - name: duration
          in: query
          required: true
          description: 'Rental duration code; currently 1h only. / 租期代码；当前仅支持 1h。'
          schema:
            type: string
            enum: [1h]
      responses:
        '200':
          description: 当前价格查询成功；该价格仅供参考，订单以 POST 受理响应为准。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateRemaining'
            X-OrderRateLimit-Limit:
              $ref: '#/components/headers/OrderRateLimit'
            X-OrderRateLimit-Remaining:
              $ref: '#/components/headers/OrderRateRemaining'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Quote'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /orders:
    post:
      operationId: createOrder
      summary: 幂等创建能量租赁订单
      parameters:
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: 首次创建成功。订单已可靠落库并进入异步处理，不代表能量已经到账。
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateRemaining'
            X-OrderRateLimit-Limit:
              $ref: '#/components/headers/OrderRateLimit'
            X-OrderRateLimit-Remaining:
              $ref: '#/components/headers/OrderRateRemaining'
            Location:
              description: 订单的规范查询地址。
              schema:
                type: string
            Retry-After:
              description: 非终态订单返回；建议至少等待多少秒后首次查询订单。
              schema:
                type: integer
                example: 2
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OrderAccepted'
        '200':
          description: 相同幂等请求返回已有结果
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateRemaining'
            X-OrderRateLimit-Limit:
              $ref: '#/components/headers/OrderRateLimit'
            X-OrderRateLimit-Remaining:
              $ref: '#/components/headers/OrderRateRemaining'
            Location:
              description: 订单的规范查询地址。
              schema:
                type: string
            Retry-After:
              description: 非终态订单返回；建议至少等待多少秒后再次查询订单。
              schema:
                type: integer
                example: 2
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/OrderAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      operationId: getOrderByClientOrderId
      summary: 按商户订单号查询订单
      parameters:
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
        - name: client_order_id
          in: query
          required: true
          description: 'Merchant business order ID supplied at creation. / 创建时提交的商户业务订单号。'
          schema:
            type: string
            minLength: 1
            maxLength: 64
            pattern: '^[!-~]{1,64}$'
            example: merchant-order-001
      responses:
        '200':
          description: 查询成功
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            X-RateLimit-Limit:
              $ref: '#/components/headers/RateLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateRemaining'
            X-OrderRateLimit-Limit:
              $ref: '#/components/headers/OrderRateLimit'
            X-OrderRateLimit-Remaining:
              $ref: '#/components/headers/OrderRateRemaining'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/RequestTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /orders/{order_id}:
    get:
      operationId: getOrder
      summary: 按平台订单号查询订单
      parameters:
        - $ref: '#/components/parameters/Timestamp'
        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
        - name: order_id
          in: path
