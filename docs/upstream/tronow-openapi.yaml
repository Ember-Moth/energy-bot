            X-RateLimit-Remaining:
              $ref: '#/components/headers/RateRemaining'
            X-OrderRateLimit-Limit:
              $ref: '#/components/headers/OrderRateLimit'
            X-OrderRateLimit-Remaining:
              $ref: '#/components/headers/OrderRateRemaining'
            Location:
