        - $ref: '#/components/parameters/Nonce'
        - $ref: '#/components/parameters/Signature'
        - name: client_activation_id
          in: query
          required: true
          description: 'Merchant activation business ID supplied at creation. / 创建时提交的商户激活业务编号。'
          schema:
            type: string
            minLength: 1
            maxLength: 64
