[project]
name = "energy-bot"
version = "0.1.0"
description = "Telegram bot built with aiogram 3"
readme = "README.md"
authors = [
    { name = "Ember Moth", email = "ember_moth@proton.me" }
]
requires-python = ">=3.14.7"
dependencies = [
    "aiogram>=3.31.0",
    "aiohttp>=3.14.3",
    "platformdirs>=4.11.11",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "uvloop>=0.22",
]

[project.scripts]
energy-bot = "energy_bot:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "commitizen>=4.18.1",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "ASYNC", # flake8-async
    "B",   # flake8-bugbear
    "A",   # builtins shadowing
    "C4",  # flake8-comprehensions
    "DTZ", # flake8-datetimez
    "T10", # flake8-debugger
    "S",   # flake8-bandit 安全检查
    "PL",  # pylint
    "TRY", # tryceratops
    "RUF", # ruff 自身规则
]
ignore = [
    "S101",   # assert 用于测试
    "TRY003", # 异常携带长消息是本项目惯例(中文提示)
    "PLR0913", # 参数过多(装配函数常见)
    "PLR2004", # 比较中的魔法值(校验逻辑常见)
    "PLR0911", # 返回语句过多(handler 需要早退)
    "PLR0912", # 分支过多(回调需要多项校验)
    "PLR0915", # 语句过多(amain 装配步骤多)
    "RUF001", # 字符串中的中文全角标点（，：！等）是合法的
    "RUF002", # docstring 同上
    "RUF003", # 注释同上
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR0913"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "pep440"
version_provider = "pep621"
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
