# energy-bot 配置。
# 环境变量(前缀 ENERGY_BOT_)会覆盖这些值,嵌套键用双下划线,例如 ENERGY_BOT_WEBHOOK__PORT。
# 配置文件路径:--config 参数 > ENERGY_BOT_CONFIG 环境变量 > 平台默认目录
# (Linux: ~/.config/energy-bot/;macOS: ~/Library/Application Support/energy-bot/)。
# config.yaml 已被 gitignore,不会提交到仓库。

bot_token: ""                # @BotFather 的 bot token;或设 ENERGY_BOT_BOT_TOKEN

webhook:                     # Telegram 推送更新的公网 HTTPS 端点
  base_url: ""               # 公网地址,例如 https://bot.example.com(必填,须 https)
  host: "127.0.0.1"          # 监听地址(通常前面有反向代理;需直接对外可改 0.0.0.0)
  port: 8080
  path: /webhook             # 更新路径;建议改成随机串增加一层防护
  secret_token: ""           # 留空 = 每次启动自动生成(仅本次有效);固定则填随机串:
                             #   python -c "import secrets; print(secrets.token_urlsafe(32))"

database:                    # PostgreSQL(SQLAlchemy async + asyncpg)
  address: localhost         # 主机
  port: 5432                 # 端口
  username: energy_bot       # 用户名
  password: ""               # 密码;建议环境变量注入不落盘:ENERGY_BOT_DATABASE__PASSWORD
  database: energy_bot       # 库名
  pool_size: 5               # 连接池常驻连接数
  max_overflow: 10           # 峰值时允许的超额连接数
  # DSN 只允许环境变量:ENERGY_BOT_DATABASE__DSN(设置后优先生效);
  # 配置文件里禁止出现 dsn 字段,请使用上面的离散字段

upstream:                     # 仅配置一家时直采,配置两家时比价
  tronow:                     # TRONow 商户 OpenAPI(签名细节见 docs/upstream/tronow.md)
    base_url: "https://api.tronow.io/openapi/v1"
    api_key: ""               # 商户 API Key;建议环境变量注入:ENERGY_BOT_UPSTREAM__TRONOW__API_KEY
    api_secret: ""            # 请求签名密钥;同上(...API_SECRET),与 webhook 密钥互为独立密钥
    webhook_secret: ""        # 回调验签密钥(X-Lease-Signature);留空则回调端点拒绝一切请求(503)
    account_scope: ""         # 空时所有 TRONow key 共用默认商户桶;不发送给上游
    request_limit: 50          # 商户滚动 1 秒 API 配额,按平台实际配置调整
    order_limit: 10            # 订单/地址激活 POST 共用的滚动 1 秒配额
    timeout_seconds: 10       # 单请求超时(秒)
  tronbid:                    # TronBid Quick Rent API(无 webhook,纯轮询;快照见 docs/upstream/quick-rent-v2.json)
    base_url: "https://tronbid.com/api/v2/quick-rent"
    api_key: ""               # API Key(Authorization: Bearer);建议环境变量注入:ENERGY_BOT_UPSTREAM__TRONBID__API_KEY
    account_scope: ""         # 同一商户多个 key/实例需填同一限流标识;空时按 API key 隔离
    timeout_seconds: 10       # 单请求超时(秒)

logging:                     # 日志配置
  level: INFO                # DEBUG/INFO/WARNING/ERROR/CRITICAL
  log_dir: ""                # 日志文件目录;空 = 只输出 stdout(systemd 部署收入 journald)
  json_logs: false           # stdout 用 JSON 格式,生产环境建议 true;文件始终为 JSON

rental:
  enabled: false              # 配置好上游余额与产品后启用订单工作器和 /rent
  products: []               # 由你设定销售价;用户不能传入价格
  # products:
  #   - energy_amount: 65000
  #     duration_minutes: 60
  #     price_trx: "5.000000" # 示例销售价,不是实际推荐定价
  #     max_cost_trx: "4.000000" # 多上游询价预算;单上游仅成交后告警,默认销售价
  poll_seconds: 5
  lease_seconds: 180          # 任务租约,须覆盖询价和提交的超时窗口
  batch_size: 20             # 单轮维护/tick 的处理上限;生产消费者持续领取
  max_submit_attempts: 5     # 不确定提交的自动恢复预算,耗尽保留冻结款并核对原单
  quote_retry_limit: 3        # 多上游无可采购报价时重试次数,耗尽释放用户冻结款
  order_concurrency: 8       # 每进程采购消费者数
  notification_concurrency: 4 # 独立通知消费者数
  idle_poll_seconds: 1        # 队列为空时的等待;有任务时连续消费
  quote_cache_seconds: 2      # UNLOGGED 读缓存 TTL;0 关闭
  balance_cache_seconds: 1    # 余额仅作候选筛选,不保证成交余额
  upstream_concurrency: 4     # 每进程、每供应商的并发 HTTP 上限
  upstream_requests_per_second: 20 # TronBid 商户跨进程共享的平滑请求速率
  upstream_orders_per_second: 5    # TronBid 商户跨进程共享的下单速率
